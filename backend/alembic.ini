[alembic]
# Path to migration scripts (relative to this file)
script_location = %(here)s/alembic

# Revision file naming: YYYY-MM-DD_<slug>
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# sqlalchemy.url is overridden in env.py via DATABASE_URL env var.
# This value is only used when running `alembic` CLI without the env var set.
sqlalchemy.url = postgresql+psycopg2://consolidator:consolidator@localhost:5432/consolidator

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
