version: "3.9"

# Podman rootless compatible: no privileged containers, no host-mode networking,
# named volumes for persistence, :z SELinux label on bind mounts.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consolidator}
      POSTGRES_USER: ${POSTGRES_USER:-consolidator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consolidator}
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consolidator} -d ${POSTGRES_DB:-consolidator}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - consolidator_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-consolidator}:${POSTGRES_PASSWORD:-consolidator}@postgres:5432/${POSTGRES_DB:-consolidator}
      ENGINE_URL: http://engine:8001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/src/backend:z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - consolidator_net

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-consolidator}:${POSTGRES_PASSWORD:-consolidator}@postgres:5432/${POSTGRES_DB:-consolidator}
      BACKEND_URL: http://backend:8000
    expose:
      - "8001"
    volumes:
      - ./engine:/src/engine:z
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - consolidator_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./frontend:/app:z
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - consolidator_net

  # Optional backup service — run on demand with:
  #   docker compose run --rm backup
  # Or schedule via host cron:
  #   0 2 * * * docker compose -f /path/to/docker-compose.yml run --rm backup
  backup:
    image: postgres:16-alpine
    profiles:
      - backup
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consolidator}
      POSTGRES_DB: ${POSTGRES_DB:-consolidator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consolidator}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_RETAIN: "${BACKUP_RETAIN:-7}"
    volumes:
      - ./scripts:/scripts:ro,z
      - ./backups:/backups:z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - consolidator_net
    entrypoint: ["sh", "-c", "BACKUP_DIR=/backups sh /scripts/backup.sh"]

volumes:
  postgres_data:

networks:
  consolidator_net:
    driver: bridge
